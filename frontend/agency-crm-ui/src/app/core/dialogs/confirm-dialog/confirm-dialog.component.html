<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ data.cancelLabel ?? 'Abbrechen' }}</button>
  <button mat-raised-button color="warn" (click)="onConfirm()">{{ data.confirmLabel ?? 'Ja' }}</button>
</mat-dialog-actions>
