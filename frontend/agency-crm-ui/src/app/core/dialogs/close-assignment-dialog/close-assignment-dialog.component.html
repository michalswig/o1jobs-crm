<h2 mat-dialog-title>Zamknij zlecenie</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>Powód zamknięcia</mat-label>
      <mat-select formControlName="reason">
        @for (r of reasons; track r) {
          <mat-option [value]="r">{{ r }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Notatki (opcjonalnie)</mat-label>
      <textarea matInput formControlName="notes" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Anuluj</button>
  <button mat-raised-button color="warn" (click)="onConfirm()">Zamknij zlecenie</button>
</mat-dialog-actions>
