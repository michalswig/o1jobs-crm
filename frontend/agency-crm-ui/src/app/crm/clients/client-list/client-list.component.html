<div class="page-header">
  <h2>Kundenliste ({{ totalElements }})</h2>
  <a mat-raised-button color="primary" routerLink="/clients/new">
    <mat-icon>person_add</mat-icon>
    Neuer Kunde
  </a>
</div>

<mat-card class="table-card">
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let client">{{ client.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>E-Mail</th>
      <td mat-cell *matCellDef="let client">{{ client.email }}</td>
    </ng-container>

    <ng-container matColumnDef="city">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Stadt</th>
      <td mat-cell *matCellDef="let client">{{ client.city }}</td>
    </ng-container>

    <ng-container matColumnDef="country">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Land</th>
      <td mat-cell *matCellDef="let client">{{ client.country }}</td>
    </ng-container>

    <ng-container matColumnDef="intermediaryName">
      <th mat-header-cell *matHeaderCellDef>Partner</th>
      <td mat-cell *matCellDef="let client">{{ client.intermediaryName ?? '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Aktionen</th>
      <td mat-cell *matCellDef="let client">
        <a mat-button color="primary" [routerLink]="['/clients/edit', client.id]">Bearbeiten</a>
        <a mat-button [routerLink]="['/assignments']" [queryParams]="{clientId: client.id}">Aufträge</a>
        <button mat-button color="warn" (click)="onDeactivate(client.id)">Deaktivieren</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
  <mat-paginator
    [length]="totalElements"
    [pageSize]="pageSize"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPageChange($event)">
  </mat-paginator>
</mat-card>
