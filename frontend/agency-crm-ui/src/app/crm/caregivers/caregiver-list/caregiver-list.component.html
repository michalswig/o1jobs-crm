<div class="page-header">
  <h2>Liste der Betreuerinnen ({{ totalElements }})</h2>
  <a mat-raised-button color="primary" routerLink="/caregivers/new">
    <mat-icon>person_add</mat-icon>
    Neue Betreuerin
  </a>
</div>

<mat-card class="table-card">
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="photo">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let caregiver">
        <app-caregiver-avatar [caregiverId]="caregiver.id" [hasPhoto]="caregiver.hasPhoto" [size]="36"></app-caregiver-avatar>
      </td>
    </ng-container>

    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nachname</th>
      <td mat-cell *matCellDef="let caregiver">{{ caregiver.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Vorname</th>
      <td mat-cell *matCellDef="let caregiver">{{ caregiver.firstName }}</td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Telefon</th>
      <td mat-cell *matCellDef="let caregiver">{{ caregiver.phone }}</td>
    </ng-container>

    <ng-container matColumnDef="nationality">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nationalität</th>
      <td mat-cell *matCellDef="let caregiver">{{ caregiver.nationality | enumLabel }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Aktionen</th>
      <td mat-cell *matCellDef="let caregiver">
        <a mat-button color="primary" [routerLink]="['/caregivers/edit', caregiver.id]">Bearbeiten</a>
        <button mat-button color="warn" (click)="onDeactivate(caregiver.id)">Deaktivieren</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator
    [length]="totalElements"
    [pageSize]="pageSize"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPageChange($event)">
  </mat-paginator>
</mat-card>
