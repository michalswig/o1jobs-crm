<div class="page-header">
  <h2>Lista opiekunek ({{ totalElements }})</h2>
  <a mat-raised-button color="primary" routerLink="/caregivers/new">
    <mat-icon>person_add</mat-icon>
    Nowa opiekunka
  </a>
</div>

<mat-card class="table-card">
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nazwisko</th>
      <td mat-cell *matCellDef="let caregiver">{{ caregiver.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Imię</th>
      <td mat-cell *matCellDef="let caregiver">{{ caregiver.firstName }}</td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Telefon</th>
      <td mat-cell *matCellDef="let caregiver">{{ caregiver.phone }}</td>
    </ng-container>

    <ng-container matColumnDef="nationality">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Narodowość</th>
      <td mat-cell *matCellDef="let caregiver">{{ caregiver.nationality }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Akcje</th>
      <td mat-cell *matCellDef="let caregiver">
        <a mat-button color="primary" [routerLink]="['/caregivers/edit', caregiver.id]">Edytuj</a>
        <button mat-button color="warn" (click)="onDeactivate(caregiver.id)">Dezaktywuj</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator
    [length]="totalElements"
    [pageSize]="pageSize"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPageChange($event)">
  </mat-paginator>
</mat-card>
