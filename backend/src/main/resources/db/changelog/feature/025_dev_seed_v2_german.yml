databaseChangeLog:

  # --- usuwamy stary (polski) seed data po jego znanych ID ---
  # UWAGA: usuwamy TYLKO wiersze wstawione przez oryginalny 020_dev_seed.yml
  # (zakres ID 101-104), NIE robimy blanket DELETE FROM - żeby nie ruszyć
  # żadnych danych, które mogłeś od tamtej pory ręcznie dodać przez UI
  # (np. testowe rekordy z zakresu 105+ widoczne w logach).
  - changeSet:
      id: 20260905-02
      author: o1jobs
      context: dev
      changes:
        - sql:
            sql: |
              DELETE FROM assignment_document WHERE assignment_id IN (
                SELECT id FROM assignment
                WHERE client_id IN (101, 102, 103)
                   OR care_recipient_id IN (101, 102, 103)
                   OR caregiver_id IN (101, 102, 103, 104)
              );
              DELETE FROM assignment
              WHERE client_id IN (101, 102, 103)
                 OR care_recipient_id IN (101, 102, 103)
                 OR caregiver_id IN (101, 102, 103, 104);
              DELETE FROM care_recipient_required_capability WHERE care_recipient_id IN (101, 102, 103);
              DELETE FROM caregiver_capability WHERE caregiver_id IN (101, 102, 103, 104);
              DELETE FROM care_recipient WHERE id IN (101, 102, 103);
              DELETE FROM caregiver WHERE id IN (101, 102, 103, 104);
              DELETE FROM client WHERE id IN (101, 102, 103);
              DELETE FROM intermediary WHERE id IN (101, 102);
      rollback:
        - empty

