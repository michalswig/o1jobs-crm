  # --- reset liczników auto-increment po jawnym wstawieniu ID ---
  # Bez tego pierwszy INSERT wykonany przez aplikację (np. z formularza na froncie)
  # spróbuje użyć id już zajętego przez dane testowe i wywali unique constraint violation.
  # pg_get_serial_sequence działa poprawnie zarówno dla SERIAL, jak i GENERATED AS IDENTITY.
  - changeSet:
      id: 20260816-09
      author: o1jobs
      context: dev
      changes:
        - sql:
            sql: |
              SELECT setval(pg_get_serial_sequence('intermediary', 'id'), (SELECT MAX(id) FROM intermediary));
              SELECT setval(pg_get_serial_sequence('client', 'id'), (SELECT MAX(id) FROM client));
              SELECT setval(pg_get_serial_sequence('caregiver', 'id'), (SELECT MAX(id) FROM caregiver));
              SELECT setval(pg_get_serial_sequence('care_recipient', 'id'), (SELECT MAX(id) FROM care_recipient));
              SELECT setval(pg_get_serial_sequence('assignment', 'id'), (SELECT MAX(id) FROM assignment));
      rollback:
        - empty