databaseChangeLog:
  - changeSet:
      id: 20260604-06
      author: o1jobs
      changes:
        - createTable:
            tableName: intermediary
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: intermediary_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(255)
              - column:
                  name: city
                  type: VARCHAR(255)
              - column:
                  name: postal_code
                  type: VARCHAR(255)
              - column:
                  name: street_address
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_by_user_id
                  type: BIGINT
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
              - column:
                  name: updated_by_user_id
                  type: BIGINT
              - column:
                  name: deleted_at
                  type: TIMESTAMPTZ
      rollback:
        - dropTable:
            tableName: intermediary