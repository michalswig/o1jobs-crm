services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/crm_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: dGVzdFNlY3JldEtleVRoYXRJc0xvbmdFbm91Z2hGb3JIVFQ=
    ports:
      - "8080:8080"